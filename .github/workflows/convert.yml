name: 转换 Cealing-Host 为 Clash 订阅

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载 Cealing-Host.json
        run: |
          curl -o Cealing-Host.json https://gitlab.com/SpaceTimee/Cealing-Host/raw/main/Cealing-Host.json

      - name: 生成完整 Clash 订阅配置
        run: |
          python3 << 'EOF'
          import json
          import re
          import datetime

          with open('Cealing-Host.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          # 提取所有域名
          domains = []
          for item in data:
              if isinstance(item, list) and len(item) >= 1:
                  domain_list = item[0]
                  if isinstance(domain_list, list):
                      for d in domain_list:
                          if isinstance(d, str) and d:
                              clean = d.strip()
                              clean = re.sub(r'^[\*\$\#\^]', '', clean)
                              clean = re.sub(r'\^$', '', clean)
                              if clean:
                                  domains.append(clean)

          domains = sorted(set(domains))

          # 生成完整的 Clash 配置文件
          with open('cealing-subscription.yaml', 'w', encoding='utf-8') as f:
              f.write('# ===========================================\n')
              f.write('# Cealing-Host Clash 订阅配置\n')
              f.write('# 由 GitHub Actions 自动生成\n')
              f.write('# 更新时间: ' + datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S') + '\n')
              f.write('# ===========================================\n\n')

              # 混合端口
              f.write('mixed-port: 7890\n')
              f.write('allow-lan: false\n')
              f.write('mode: rule\n')
              f.write('log-level: info\n\n')

              # 外部控制
              f.write('external-controller: 127.0.0.1:9090\n')
              f.write('external-ui: yacd\n\n')

              # 代理节点（占位，需要你手动填写或合并）
              f.write('# ==================== 代理节点 ====================\n')
              f.write('# 请在这里填写你的节点\n')
              f.write('# 示例：\n')
              f.write('# proxies:\n')
              f.write('#   - name: "HK-01"\n')
              f.write('#     type: vless\n')
              f.write('#     server: 1.2.3.4\n')
              f.write('#     port: 443\n')
              f.write('#     uuid: your-uuid\n')
              f.write('#     tls: true\n')
              f.write('#     flow: xtls-rprx-vision\n')
              f.write('#     servername: www.cloudflare.com\n')
              f.write('#     reality-opts:\n')
              f.write('#       public-key: your-public-key\n')
              f.write('#       short-id: your-short-id\n')
              f.write('proxies: []\n\n')

              # 代理组
              f.write('# ==================== 代理组 ====================\n')
              f.write('proxy-groups:\n')
              f.write('  - name: PROXY\n')
              f.write('    type: select\n')
              f.write('    proxies: []\n')
              f.write('  - name: Cealing-Host\n')
              f.write('    type: select\n')
              f.write('    proxies:\n')
              f.write('      - PROXY\n')
              f.write('      - DIRECT\n')
              f.write('      - REJECT\n\n')

              # 规则提供者
              f.write('# ==================== 规则 ====================\n')
              f.write('rule-providers:\n')
              f.write('  cealing-domains:\n')
              f.write('    type: file\n')
              f.write('    url: https://raw.githubusercontent.com/XANGPIRENNN/clash-rule-generator/main/cealing-domains.yaml\n')
              f.write('    path: ./cealing-domains.yaml\n')
              f.write('    interval: 86400\n')
              f.write('    behavior: domain\n\n')

              f.write('rules:\n')
              f.write('  - RULE-SET,cealing-domains,Cealing-Host\n')
              f.write('  - MATCH,PROXY\n')

          print(f"✅ 生成 cealing-subscription.yaml（完整订阅配置）")
          print(f"📝 包含 {len(domains)} 条域名规则")

          EOF

      - name: 提交并推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cealing-subscription.yaml
          git diff --staged --quiet || git commit -m "🤖 自动更新: 生成 Clash 订阅配置 $(date '+%Y-%m-%d')"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/XANGPIRENNN/clash-rule-generator.git
